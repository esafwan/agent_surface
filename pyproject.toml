[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-surface"
version = "0.1.0"
description = "Agent Surface Board: a portable, versioned, agent-driven review board runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The default renderer (surface.board_web) needs only FastAPI + uvicorn;
# `gradio` is the legacy `--renderer gradio` path.
board = ["fastapi>=0.110", "uvicorn>=0.27"]
gradio = ["gradio>=4.0,<6"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
surface = "surface.cli:main"

[tool.setuptools]
packages = ["surface", "surface.transports", "surface.providers", "surface.stages"]

[tool.setuptools.package-data]
surface = ["stages/*.json", "static/*"]

[tool.pytest.ini_options]
markers = [
    "live_agent: invokes a real coding-agent CLI binary; skip cleanly if missing",
    "agent_fault: fault-injection test through the real Supervisor/worker path",
]
